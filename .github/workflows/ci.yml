name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.5.0
      - run: npm exec --yes --package=pnpm@12.14.0 -- pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:plan
      - run: npm run test:db -- harness
      - run: npm exec --yes --package=pnpm@12.14.0 -- pnpm exec playwright install chromium
      - run: npm run test:e2e -- harness
